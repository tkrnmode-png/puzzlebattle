const stats = { clears: 0, maxChain: 0 };
game.fx = [];
function spawnShot(from, to, n) {

                 to, size: Math.min(20, 9 + n * 0.6), col: from.idx === 0 ? '#74c0fc' : '#ff8787' });

function stepFx(dt) {
  for (const f of game.fx) { f.t += dt; if (f.t >= f.dur && !f.hit) { f.hit = true; f.to.pulse = 0.45; } }

function drawFx() {
  for (const f of game.fx) {

    for (let j = 5; j >= 0; j--) {
      const k = Math.max(0, f.t / f.dur - j * 0.04), e = k * k * (3 - 2 * k);
      const x = f.x0 + (f.x1 - f.x0) * e, y = f.y0 + (f.y1 - f.y0) * e - Math.sin(Math.PI * k) * 140;
      const r = f.size * (1 - j * 0.13);

// 盤面は左右対称：[キャラ・NEXTの列][盤面]  VS  [盤面][キャラ・NEXTの列]
const BOARD_X = 128, BOARD_Y = 84;
boards.push(new Board(BOARD_X, BOARD_Y, false));
boards.push(new Board(W - BOARD_X - COLS * CS, BOARD_Y, true));
boards[0].opp = boards[1]; boards[1].opp = boards[0];

// ---------------- 流れ ----------------
// ひとりで：タイトル → モード → キャラ → 強さ・体力 → 6人抜き
// ふたりで：タイトル → モード → ふたり同時にキャラ → 体力ルール → 対戦（何戦でも）
boards[0].idx = 0; boards[1].idx = 1;
const held = { k: [false, false], p: [false, false] };          // 高速落下の押しっぱなし（キー／コントローラー）
function resetHeld() { held.k[0] = held.k[1] = held.p[0] = held.p[1] = false; }
const isVs = () => game.mode === 'vs';

function chooseMode(i) {
  game.modeSel = i;
  if (i === 4) { enterNet(); Snd.se('decide'); return; }
  if (i === 2) { enterTutorial(); Snd.se('decide'); return; }
  if (i === 3) { game.state = 'records'; Snd.se('decide'); return; }
  if (i === 0) { game.mode = 'single'; game.state = 'select'; }
  else { game.mode = 'vs'; game.state = 'vsSelect'; game.vs.ready = [false, false]; game.vs.wins = [0, 0]; game.t = 0; }
  Snd.se('decide');
}
function beginRun(sel) {
  const others = CHARS.map((_, i) => i).filter(i => i !== sel).sort(() => Math.random() - 0.5);
  game.run = { player: sel, ladder: others, stage: 0, continues: 0 };
  game.state = 'intro'; game.t = 0;
  Snd.se('decide');
}
function startMatch() {
  const vs = isVs();
  const online = game.mode === 'net';
  boards[0].isCpu = false; boards[1].isCpu = !vs && !online; boards[1].remote = online; boards[0].fixedQ = boards[1].fixedQ = null;
  SEQ = []; seqRng = online ? mulberry32(net.seed) : null; game.playT = 0; game.speedLv = 0; game.marginLv = 0;
  boards[0].level = 1; boards[1].level = game.level;
  if (online) { boards[0].start(CHARS[net.sel]); boards[1].start(CHARS[net.oppSel]); netMatchBegin(); }
  else if (vs) { boards[0].start(CHARS[game.vs.sel[0]]); boards[1].start(CHARS[game.vs.sel[1]]); }
  else { const r = game.run; boards[0].start(CHARS[r.player]); boards[1].start(CHARS[r.ladder[r.stage]]); }
  game.state = 'ready'; game.t = 1.8; game.result = null; game.pops = []; game.fx = []; game.paused = false; game.cursor = 0;

}
function startGame(sel) { game.mode = 'single'; beginRun(sel); startMatch(); }   // テスト用：紹介を飛ばして即対戦
function isLastStage() { return game.run && game.run.stage >= game.run.ladder.length - 1; }
function checkEnd() {
  const [p, c] = boards;

  if (!pd && !cd) return;
  let res = pd && cd ? 'draw' : pd ? 'lose' : 'win';
  if (!isVs() && res === 'draw') res = 'lose';
  game.state = 'over'; game.result = res; game.t = 0; game.cursor = 0; resetHeld();
  const R = game.rec; R.matches++;
  if (isVs()) { if (res === 'win') { game.vs.wins[0]++; R.vs.p1++; } else if (res === 'lose') { game.vs.wins[1]++; R.vs.p2++; } else R.vs.draw++; Snd.se(res === 'draw' ? 'lose' : 'win'); }
  else { if (res === 'win') R.cpuWins++; Snd.se(res); }

}
function nextAfterWin() {
  if (isLastStage()) {
    game.state = 'clear'; game.t = 0; Snd.se('decide');
    const R = game.rec, lv = game.level, tm = game.run.time || 0;
    R.clears[lv]++; game.newRecord = R.best[lv] == null || tm < R.best[lv];
    if (game.newRecord) R.best[lv] = tm;
    saveRec();
  }
  else { game.run.stage++; game.state = 'intro'; game.t = 0; Snd.se('decide'); }
}
function chooseLoseMenu(i) {
  if (i === 0) { game.run.continues++; game.state = 'intro'; game.t = 0; Snd.se('decide'); }
  else { game.state = 'select'; Snd.se('select'); }
}
function pauseItems() { return game.mode === 'tutor' ? ['ゲームにもどる', 'チュートリアルのメニューへ'] : ['ゲームにもどる', 'キャラクター選択へ', 'モード選択へ']; }
function choosePause(i) {
  game.paused = false; Snd.pause(false); resetHeld();
  if (i === 0) { Snd.se('select'); return; }
  Snd.se('select');
  if (game.mode === 'tutor') { game.state = 'tutMenu'; return; }
  if (i === 1) { if (isVs()) { game.state = 'vsSelect'; game.vs.ready = [false, false]; game.t = 0; } else game.state = 'select'; }
  else game.state = 'mode';
}
function pauseBtn(i) { return { x: W / 2 - 200, y: 300 + i * 66, w: 400, h: 54 }; }
function chooseVsMenu(i) {
  if (i === 0) { game.state = 'intro'; game.t = 0; Snd.se('decide'); }
  else if (i === 1) { game.state = 'vsSelect'; game.vs.ready = [false, false]; game.t = 0; Snd.se('select'); }
  else { game.state = 'mode'; Snd.se('select'); }
}
function step(dt) {
  pollPad(dt);
  stepKeyRep(dt);
  Snd.sync(game.state);
  if (game.paused) return;
  for (const p of game.pops) p.t -= dt;
  game.pops = game.pops.filter(p => p.t > 0);
  stepFx(dt);
  const s = game.state;
  if (s === 'vsSelect') { if (game.vs.ready[0] && game.vs.ready[1]) { game.t += dt; if (game.t >= 0.6) { game.state = 'vsRule'; Snd.se('decide'); } } else game.t = 0; }
  else if (/^net/.test(s)) netLobbyStep(dt);

// ---------------- 入力 ----------------
// ボタン: L R U D（方向） A（決定・回転） B（戻る・逆回転） OK（Enter） BACK（Backspace・Esc） PAUSE（P・START）
// pl = どのプレイヤーの入力か（0=1P, 1=2P, null=共通）
function press(btn, isRepeat, pl) {
  Snd.init();
  const s = game.state, ok = btn === 'A' || btn === 'OK' || btn === 'PAUSE', back = btn === 'B' || btn === 'BACK';
  const dir = btn === 'L' || btn === 'R' || btn === 'U' || btn === 'D';
  if (s === 'title') { if (!isRepeat) { game.state = 'mode'; if (tutAllNew()) game.modeSel = 2; Snd.se('decide'); } return; }
  if (s === 'tutMenu' || s === 'tut' || s === 'tutDone') { tutPress(btn, isRepeat); return; }
  if (s === 'records') { if ((back || ok) && !isRepeat) { game.state = 'mode'; Snd.se('select'); } return; }
  if (/^net/.test(s)) { netPress(btn, isRepeat); return; }
  if (s === 'mode') {
    const ci = MODE_CARDS.indexOf(game.modeSel), card = ci >= 0;
    if (btn === 'U') {
      if (game.modeSel === 3) { game.modeSel = game.modeLast || 0; Snd.se('select'); }
      else if (card) { game.modeLast = game.modeSel; game.modeSel = 2; Snd.se('select'); }
    }
    else if (btn === 'D') {
      if (game.modeSel === 2) { game.modeSel = game.modeLast || 0; Snd.se('select'); }
      else if (card) { game.modeLast = game.modeSel; game.modeSel = 3; Snd.se('select'); }
    }
    else if (btn === 'L' || btn === 'R') {
      if (game.modeSel === 2) game.modeSel = btn === 'L' ? 0 : MODE_CARDS[MODE_CARDS.length - 1];
      else if (card) game.modeSel = MODE_CARDS[(ci + (btn === 'L' ? MODE_CARDS.length - 1 : 1)) % MODE_CARDS.length];
      else return;
      Snd.se('select');
    }
    else if (ok && !isRepeat) chooseMode(game.modeSel);
    else if ((btn === 'B' || btn === 'BACK') && !isRepeat) { game.state = 'title'; Snd.se('select'); }
    return;
  }
  if (s === 'select') {
    if (btn === 'L') { game.sel = (game.sel + CHARS.length - 1) % CHARS.length; Snd.se('select'); }
    else if (btn === 'R') { game.sel = (game.sel + 1) % CHARS.length; Snd.se('select'); }
    else if (ok && !isRepeat) { game.state = 'level'; Snd.se('decide'); }
    else if (back && !isRepeat) { game.state = 'mode'; Snd.se('select'); }
    return;
  }
  if (s === 'level') {
    if (btn === 'U') { game.lvRow = (game.lvRow + 2) % 3; Snd.se('select'); }
    else if (btn === 'D') { game.lvRow = (game.lvRow + 1) % 3; Snd.se('select'); }
    else if (btn === 'L' || btn === 'R') {
      if (game.lvRow === 0) setLevel(game.level + (btn === 'L' ? -1 : 1));
      else if (game.lvRow === 1) setHpRule(!game.hpRule);
      else setAbilities(!game.abilities);
    }
    else if (ok && !isRepeat) beginRun(game.sel);
    else if (back && !isRepeat) { game.state = 'select'; Snd.se('select'); }
    return;
  }
  if (s === 'vsSelect') {
    if (btn === 'BACK' && !isRepeat) { game.state = 'mode'; Snd.se('select'); return; }
    if (pl == null) return;
    const v = game.vs, n = CHARS.length;
    if (btn === 'L' && !v.ready[pl]) { v.sel[pl] = (v.sel[pl] + n - 1) % n; Snd.se('select'); }
    else if (btn === 'R' && !v.ready[pl]) { v.sel[pl] = (v.sel[pl] + 1) % n; Snd.se('select'); }
    else if ((btn === 'A' || btn === 'U' || btn === 'OK' || btn === 'PAUSE') && !isRepeat && !v.ready[pl]) { v.ready[pl] = true; Snd.se('decide'); }
    else if (btn === 'B' && !isRepeat && v.ready[pl]) { v.ready[pl] = false; Snd.se('select'); }
    return;
  }
  if (s === 'vsRule') {
    if (btn === 'U' || btn === 'D') { game.vrRow = 1 - game.vrRow; Snd.se('select'); }
    else if (btn === 'L' || btn === 'R') { if (game.vrRow === 0) setHpRule(!game.hpRule); else setAbilities(!game.abilities); }
    else if ((btn === 'A' || btn === 'OK' || btn === 'PAUSE') && !isRepeat) { game.state = 'intro'; game.t = 0; Snd.se('decide'); }
    else if (back && !isRepeat) { game.state = 'vsSelect'; game.vs.ready = [false, false]; Snd.se('select'); }
    return;
  }
  if (s === 'intro') { if (ok && !isRepeat && game.t > 0.4 && game.mode !== 'net') startMatch(); return; }
  if (s === 'clear') { if (ok && !isRepeat && game.t > 1.2) { game.state = 'select'; Snd.se('select'); } return; }
  if (s === 'over') {
    if (game.t < 0.7 || isRepeat && !(btn === 'U' || btn === 'D')) return;
    if (game.mode === 'tutor') { if (ok) { game.state = 'tutDone'; game.t = 0; Snd.se('decide'); } return; }
    if (game.mode === 'net') { netOverPress(btn, ok); return; }
    if (isVs()) {
      if (btn === 'U') { game.cursor = (game.cursor + 2) % 3; Snd.se('select'); }
      else if (btn === 'D') { game.cursor = (game.cursor + 1) % 3; Snd.se('select'); }
      else if (ok) chooseVsMenu(game.cursor);
      return;
    }
    if (game.result === 'win') { if (ok) nextAfterWin(); return; }
    if (dir) { game.cursor = 1 - game.cursor; Snd.se('select'); }
    else if (ok) chooseLoseMenu(game.cursor);
    return;
  }
  // ready / play
  if (game.mode === 'net') {               // ネット対戦は止められない。P でメニュー（降参）を開くだけ
    if (game.netMenu) {
      if ((btn === 'PAUSE' || btn === 'BACK' || btn === 'B') && !isRepeat) { game.netMenu = false; Snd.se('select'); }
      else if (btn === 'U' || btn === 'D') { game.pauseCursor = 1 - game.pauseCursor; Snd.se('select'); }
      else if ((btn === 'A' || btn === 'OK') && !isRepeat) chooseNetMenu(game.pauseCursor);
      return;
    }
    if (btn === 'PAUSE' && !isRepeat) { game.netMenu = true; game.pauseCursor = 0; Snd.se('select'); return; }
  }
  if (game.paused) {
    const n = pauseItems().length;
    if ((btn === 'PAUSE' || btn === 'B' || btn === 'BACK') && !isRepeat) choosePause(0);
    else if (btn === 'U') { game.pauseCursor = (game.pauseCursor + n - 1) % n; Snd.se('select'); }
    else if (btn === 'D') { game.pauseCursor = (game.pauseCursor + 1) % n; Snd.se('select'); }
    else if ((btn === 'A' || btn === 'OK') && !isRepeat) choosePause(game.pauseCursor);
    return;
  }
  if (btn === 'PAUSE' && !isRepeat) { game.paused = true; game.pauseCursor = 0; Snd.pause(true); return; }
  if (s !== 'play' || game.paused) return;
  const b = boards[isVs() ? (pl || 0) : 0];
  if (btn === 'L') b.tryMove(-1);
  else if (btn === 'R') b.tryMove(1);
  else if ((btn === 'U' || btn === 'A') && !isRepeat) b.tryRot(1);
  else if (btn === 'B' && !isRepeat) b.tryRot(-1);
}
// キーボード：ひとりのときは矢印＋Z/X、ふたりのときは 1P=WASD＋Q＋スペース / 2P=矢印＋/＋Enter
const KEYMAP = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', z: 'A', x: 'B', Enter: 'OK', ' ': 'OK' };
const KEY_P1 = { a: 'L', d: 'R', w: 'U', s: 'D', q: 'B', ' ': 'A', e: 'A' };
const KEY_P2 = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', '/': 'B', Enter: 'A' };
const VS_STATES = new Set(['vsSelect', 'vsRule', 'intro', 'ready', 'play', 'over']);
function keyRoute(key) {
  const k = key.length === 1 ? key.toLowerCase() : key;
  if (k === 'Escape' || k === 'Backspace') return ['BACK', null];
  if (k === 'p') return ['PAUSE', null];
  if (isVs() && VS_STATES.has(game.state)) {
    if (KEY_P1[k]) return [KEY_P1[k], 0];
    if (KEY_P2[k]) return [KEY_P2[k], 1];
    return null;
  }
  return KEYMAP[k] ? [KEYMAP[k], 0] : null;
}
const keyOwner = {};
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Escape') { e.preventDefault(); press('BACK', false, null); } return; }
  if (e.key === 'm' || e.key === 'M') { Snd.init(); Snd.toggleMute(); return; }
  const r = keyRoute(e.key);
  if (!r) return;
  e.preventDefault();
  pad.lastUsed = 'key';
  const [btn, pl] = r;
  if (btn === 'D') { held.k[pl || 0] = true; keyOwner[e.key.toLowerCase()] = pl || 0; }
  if ((btn === 'L' || btn === 'R') && (game.state === 'play' || game.state === 'tut')) {
    if (e.repeat) return;                            // パソコンのキーリピートは使わず、下の keyRep で速く動かす
    keyRep[e.key.toLowerCase()] = { btn, pl, t: 0.16 };
  }
  press(btn, e.repeat, pl);
});
addEventListener('keyup', e => {
  delete keyRep[e.key.toLowerCase()];
  const o = keyOwner[e.key.toLowerCase()];
  if (o != null) { held.k[o] = false; delete keyOwner[e.key.toLowerCase()]; }
});
['touchend', 'pointerup', 'mousedown'].forEach(n => addEventListener(n, () => Snd.init(), { passive: true }));
addEventListener('blur', () => { held.k[0] = held.k[1] = false; for (const k in keyRep) delete keyRep[k]; });
const keyRep = {};                // 押しっぱなし中の左右キー（0.16秒待ってから0.05秒ごとに移動）
function stepKeyRep(dt) {
  if (!(game.state === 'play' || game.state === 'tut') || game.paused) return;
  for (const k in keyRep) {
    const r = keyRep[k]; r.t -= dt;
    if (r.t <= 0) { press(r.btn, true, r.pl); r.t = 0.05; }
  }
}

// コントローラー（標準配置：十字キー 12-15 / A=0 B=1 X=2 Y=3 / SELECT=8 START=9、左スティック）
// ふたりのときは 1台目=1P、2台目=2P。ひとりのときはどれでも1P
const pad = { prev: {}, rep: {}, connected: 0, lastUsed: 'key' };
const PAD_KEYS = ['L', 'R', 'U', 'D', 'A', 'B', 'PAUSE', 'BACK'];
function pollPad(dt) {
  let list = [];
  try { list = Array.from(navigator.getGamepads ? navigator.getGamepads() : []).filter(g => g && g.connected); }
  catch (e) { list = []; }       // 権限で禁止されている環境では何もしない
  pad.connected = list.length;
  const hp = [false, false], playing = game.state === 'play';
  list.forEach((gp, j) => {
    const pl = isVs() ? Math.min(j, 1) : 0;
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const cur = { L: b(14) || ax < -0.5, R: b(15) || ax > 0.5, U: b(12) || ay < -0.5, D: b(13) || ay > 0.5,
                  A: b(0) || b(3), B: b(1) || b(2), PAUSE: b(9), BACK: b(8) };
    if (cur.D) hp[pl] = true;
    const prev = pad.prev[gp.index] || {}, rep = pad.rep[gp.index] || (pad.rep[gp.index] = {});
    for (const k of PAD_KEYS) {
      if (cur[k] && !prev[k]) {
        pad.lastUsed = 'pad';
        press(k, false, pl);
        rep[k] = playing ? 0.16 : 0.32;              // 押しっぱなしで連続移動するまでの待ち
      } else if (cur[k] && 'LRUD'.includes(k)) {
        rep[k] -= dt;
        if (rep[k] <= 0) { press(k, true, pl); rep[k] = playing ? 0.05 : 0.14; }
      }
    }
    pad.prev[gp.index] = cur;
  });

}
const usePad = () => pad.connected > 0 && pad.lastUsed === 'pad';

// マウス・タッチ
cv.addEventListener('click', e => {
  Snd.init();
  pad.lastUsed = 'key';
  const rc = cv.getBoundingClientRect();
  const x = (e.clientX - rc.left) * VW / rc.width - OX, y = (e.clientY - rc.top) * H / rc.height;
  const inR = r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  const s = game.state;
  if (game.mode === 'net' && game.netMenu && (s === 'play' || s === 'ready')) { NET_MENU.forEach((_, i) => { if (inR(pauseBtn(i))) chooseNetMenu(i); }); return; }
  if (game.paused && (s === 'play' || s === 'ready')) { pauseItems().forEach((_, i) => { if (inR(pauseBtn(i))) choosePause(i); }); return; }
  if (s === 'title') { press('OK'); return; }
  if (s === 'records') { press('BACK'); return; }
  if (s === 'mode') { if (inR(RECORD_BTN)) { chooseMode(3); return; } if (inR(BACK_BTN)) { press('BACK'); return; } if (inR(TUT_BANNER)) { chooseMode(2); return; } for (let i = 0; i < MODE_CARDS.length; i++) if (inR(modeCard(i))) { chooseMode(MODE_CARDS[i]); return; } return; }
  if (/^net/.test(s)) { netClick(inR); return; }
  if (s === 'tutMenu') {
    if (inR(BACK_BTN)) { press('BACK'); return; }
    for (let i = 0; i < LESSONS.length; i++) if (inR(tutRow(i))) { game.tutCursor = i; press('OK'); return; }
    return;
  }
  if (s === 'tutDone') { press('OK'); return; }
  if (s === 'tut') {
    if (inR(TUT_MENU_BTN)) { press('BACK'); return; }
    if (inR(SKIP_BTN)) { press('PAUSE'); return; }
    press('OK'); return;
  }
  if (s === 'select') {
    if (inR(BACK_BTN)) { press('BACK'); return; }
    for (let i = 0; i < CHARS.length; i++) {
      if (inR({ x: cardX(i), y: CARD_Y, w: CARD_W, h: CARD_H })) {
        if (game.sel === i) press('OK'); else { game.sel = i; Snd.se('select'); }
        return;
      }
    }
    if (inR(PANEL)) press('OK');
    return;
  }
  if (s === 'level') {
    for (let i = 0; i < 2; i++) if (inR(ruleBtn(i))) { game.lvRow = 1; if (game.hpRule !== (i === 0)) setHpRule(i === 0); return; }
    for (let i = 0; i < 2; i++) if (inR(abBtn(i))) { game.lvRow = 2; if (game.abilities !== (i === 0)) setAbilities(i === 0); return; }
    for (let i = 0; i < LEVELS.length; i++) if (inR(levelCard(i))) { if (game.level !== i) setLevel(i); press('OK'); return; }
    if (inR(BACK_BTN)) press('BACK');
    return;
  }
  if (s === 'vsSelect') { if (inR(BACK_BTN)) press('BACK'); return; }
  if (s === 'vsRule') {
    for (let i = 0; i < 2; i++) if (inR(ruleCard(i))) { game.vrRow = 0; if (game.hpRule !== (i === 0)) setHpRule(i === 0); return; }
    for (let i = 0; i < 2; i++) if (inR(abBtnVs(i))) { game.vrRow = 1; if (game.abilities !== (i === 0)) setAbilities(i === 0); return; }
    if (inR(START_BTN)) { press('OK'); return; }
    if (inR(BACK_BTN)) press('BACK');
    return;
  }
  if (s === 'intro' || s === 'clear') { press('OK'); return; }
  if (s === 'over' && game.t >= 0.7) {
    if (game.mode === 'tutor') { press('OK'); return; }
    if (game.mode === 'net') { netOverClick(inR); return; }
    if (isVs()) { for (let i = 0; i < 3; i++) if (inR(vsBtn(i))) { chooseVsMenu(i); return; } return; }
    if (game.result === 'win') { press('OK'); return; }
    for (let i = 0; i < 2; i++) if (inR(loseBtn(i))) { chooseLoseMenu(i); return; }
  }
});

const TUT_KEYS = { key: { lr: '← →', rot: '↑ か Z', down: '↓', ok: 'Enter' },

const tutK = () => usePad() ? TUT_KEYS.pad : TUT_KEYS.key;
game.tutDone = [0, 0, 0, 0, 0, 0, 0];
try { const s = localStorage.getItem('cbp-tut'); if (s && s.length === 7) game.tutDone = s.split('').map(Number); } catch (e) {}
const tutAllNew = () => game.tutDone.every(v => !v);
function markLesson(i) { game.tutDone[i] = 1; try { localStorage.setItem('cbp-tut', game.tutDone.join('')); } catch (e) {} }
const newEv = () => ({ moveL: 0, moveR: 0, rot: 0, softLock: 0, clear: 0, maxChain: 0, offset: 0, garbCleared: 0, rainbow: 0, settled: 0 });
function tutEv(name, v) {
  if (game.state !== 'tut' || !game.tut) return;
  const e = game.tut.ev;

function enterTutorial() {
  game.tutSaved = { level: game.level, hpRule: game.hpRule, abilities: game.abilities, sel: game.sel };
  game.hpRule = true; game.abilities = true;
  game.mode = 'tutor'; game.state = 'tutMenu';

  if (s) { game.level = s.level; game.hpRule = s.hpRule; game.abilities = s.abilities; game.sel = s.sel; game.tutSaved = null; }
  game.mode = 'single'; game.state = 'mode'; game.modeSel = 2;
}
function applySetup(su) {
  const b = boards[0];
  b.fixedQ = su.queue || null; b.fqi = 0;
  b.start(CHARS[su.char || 0]);
  b.pw = su.pw || null; b.look = 1; b.garb = 'random';
  const map = { R: 0, B: 1, G: 2, Y: 3, P: 4, '*': 5 };
  (su.grid || []).forEach((row, k) => {
    for (let c = 0; c < COLS; c++) {
      const ch = row[c];
      if (ch === 'X') b.grid[ROWS - 1 - k][c] = { g: true };
      else if (map[ch] != null) b.grid[ROWS - 1 - k][c] = { t: map[ch] };
    }

  b.phase = 'wait'; b.t = 0.35;
  game.tut.lastSetup = su;
  game.tut.ev = newEv();
}

const curStep = () => curLesson().steps[game.tut.step];
function startLesson(i) {
  game.state = 'tut'; game.pops = [];
  game.tut = { lesson: i, step: 0, t: 0, ev: newEv(), doneT: 0, failT: 0, phase: 'step', lastSetup: { grid: [] } };
  resetHeld();
  startStep();
}
function startStep() {
  const T = game.tut, st = curStep();
  T.t = 0; T.doneT = 0; T.ev = newEv();
  if (st.setup) applySetup(st.setup);
}
function advanceStep() {
  const T = game.tut, st = curStep();
  if (st.practice) { markLesson(T.lesson); startPractice(); return; }
  T.step++;
  if (T.step >= curLesson().steps.length) { markLesson(T.lesson); T.phase = 'clear'; T.t = 0; Snd.se('win'); return; }
  startStep();
}
function nextLesson() {
  const i = game.tut.lesson + 1;
  if (i < LESSONS.length) startLesson(i); else { game.state = 'tutDone'; game.t = 0; }
}
function startPractice() {
  game.level = 0; game.hpRule = true; game.abilities = true;
  game.run = { player: 0, ladder: [4], stage: 0, continues: 0 };
  startMatch();
}
function tutStep(dt) {
  const T = game.tut; T.t += dt;
  if (T.failT > 0) T.failT -= dt;
  if (T.phase === 'clear') return;
  const st = curStep(), b = boards[0];
  if (st.play) {
    b.update(dt);
    if (b.dead) { applySetup(T.lastSetup); T.failT = 2; Snd.se('lose', 0, 0.5); return; }
  }
  if (T.doneT > 0) { T.doneT -= dt; if (T.doneT <= 0) advanceStep(); return; }
  if (st.wait != null) { if (T.t >= st.wait && (b.phase === 'wait' || b.phase === 'fall')) advanceStep(); return; }
  if (!st.play || !st.check) return;
  if (st.check(T.ev)) { T.doneT = 1.1; Snd.se('decide'); }
  else if (st.fail && st.fail(T.ev)) { applySetup(T.lastSetup); T.failT = 2.2; }
}
function tutPress(btn, isRepeat) {
  const s = game.state, ok = btn === 'A' || btn === 'OK' || btn === 'PAUSE';
  if (s === 'tutMenu') {
    const n = LESSONS.length;
    if (btn === 'U') { game.tutCursor = (game.tutCursor + n - 1) % n; Snd.se('select'); }
    else if (btn === 'D') { game.tutCursor = (game.tutCursor + 1) % n; Snd.se('select'); }
    else if (ok && !isRepeat) { Snd.se('decide'); startLesson(game.tutCursor); }
    else if ((btn === 'B' || btn === 'BACK') && !isRepeat) { Snd.se('select'); leaveTutorial(); }
    return;
  }
  if (s === 'tutDone') { if (ok && !isRepeat && game.t > 0.8) { Snd.se('decide'); leaveTutorial(); } return; }
  // s === 'tut'
  const T = game.tut, st = curStep();
  if (btn === 'BACK' && !isRepeat) { game.state = 'tutMenu'; game.tutCursor = T.lesson; Snd.se('select'); return; }
  if (btn === 'PAUSE' && !isRepeat) { Snd.se('select'); nextLesson(); return; }      // スキップ
  if (T.phase === 'clear') { if ((btn === 'A' || btn === 'OK') && !isRepeat && T.t > 0.5) nextLesson(); return; }
  if (!st.play) {
    if ((btn === 'A' || btn === 'OK') && !isRepeat && T.t > 0.3) { Snd.se('select'); advanceStep(); }
    else if (btn === 'B' && !isRepeat) { game.state = 'tutMenu'; game.tutCursor = T.lesson; Snd.se('select'); }
    return;
  }
  if (T.doneT > 0 || st.wait != null) return;
  const b = boards[0];
  if (btn === 'L') b.tryMove(-1);
  else if (btn === 'R') b.tryMove(1);
  else if ((btn === 'U' || btn === 'A') && !isRepeat) b.tryRot(1);
  else if (btn === 'B' && !isRepeat) b.tryRot(-1);
}

  });

function localTransport(topic, h) {           // 同じブラウザのタブどうし（BroadcastChannel）。Presence も真似する
  const bc = new BroadcastChannel('cbp-' + topic), peers = {};
  let alive = true;
  const emit = () => h.presence([{ id: net.id, t: net.joinT }].concat(Object.keys(peers).map(id => ({ id, t: peers[id].t }))));
  bc.onmessage = e => {
    const d = e.data; if (!d || !alive) return;
    if (d._p) {
      if (d._p === 'bye') { if (peers[d.id]) { delete peers[d.id]; emit(); } return; }
      const isNew = !peers[d.id];
      peers[d.id] = { t: d.t, last: nowS() };
      if (d._p === 'hello') bc.postMessage({ _p: 'here', id: net.id, t: net.joinT });
      if (isNew) emit();
      return;
    }
    if (peers[d.f]) peers[d.f].last = nowS();
    h.msg(d);
  };
  const iv = setInterval(() => {
    if (!alive) return;
    bc.postMessage({ _p: 'ping', id: net.id, t: net.joinT });
    let gone = false;
    for (const id in peers) if (nowS() - peers[id].last > 4) { delete peers[id]; gone = true; }
    if (gone) emit();
  }, 1000);
  setTimeout(() => { if (!alive) return; h.status('SUBSCRIBED'); bc.postMessage({ _p: 'hello', id: net.id, t: net.joinT }); emit(); }, 150);
  const bye = () => { try { bc.postMessage({ _p: 'bye', id: net.id }); } catch (e) {} };
  addEventListener('pagehide', bye);
  return {
    send: o => { if (alive) bc.postMessage(o); },
    leave: () => { if (!alive) return; bye(); alive = false; clearInterval(iv); removeEventListener('pagehide', bye); setTimeout(() => bc.close(), 50); },

// ---- 部屋に入る・出る ----
function normRoom(s) { return String(s || '').normalize('NFKC').trim().toLowerCase().replace(/\s+/g, '').slice(0, 16); }
function roomTopic(code) {                  // 部屋コード → チャンネル名（日本語でも安全な英数字にする）
  let h1 = 0x811c9dc5, h2 = 0x5bd1e995;
  for (const ch of code) { const c = ch.codePointAt(0); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); }
  return 'emojibp-' + (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
}
function enterNet() {
  net.saved = { hpRule: game.hpRule, abilities: game.abilities };    // ネット対戦中はホストのルールを使うので、元の設定を控えておく
  game.mode = 'net'; game.state = 'netRoom'; game.netMenu = false;
  net.sel = game.sel; net.msg = '';
}
function exitNet() {
  if (net.tr) netLeave();
  const sv = net.saved; if (sv) { game.hpRule = sv.hpRule; game.abilities = sv.abilities; net.saved = null; }
  game.mode = 'single'; game.state = 'mode'; game.modeSel = 4;
  netUI.hide();
}
async function netJoin(raw) {
  const code = normRoom(raw);
  if (net.status === 'connecting') return;
  if (!code) { netNote('部屋コードを入れてね'); return; }
  if (!netCfgOk()) { netNote('Supabase の設定がまだです（README の手順を見てね）', 6); return; }
  net.room = code; net.status = 'connecting'; net.connT = nowS(); net.msg = '';
  try { localStorage.setItem('cbp-room', code); } catch (e) {}
  net.lastRoom = code;
  net.joinT = Date.now(); net.members = []; net.opp = null; net.host = false; net.wins = [0, 0]; net.timedOut = {};
  net.ready = false; net.oppReady = false; net.oppSel = null; net.lastRx = nowS(); net.unstable = false;
  const h = { presence: netPresence, msg: netRecv, status: netStatus };
  try {
    if (NET_LOCAL) net.tr = localTransport(roomTopic(code), h);
    else {
      const lib = await loadSupabase();
      if (net.status !== 'connecting') return;               // 読み込み中にもどった
      if (!sbClient) sbClient = lib.createClient(NET_CFG.url, NET_CFG.key, { realtime: { params: { eventsPerSecond: 30 } } });
      net.tr = sbTransport(roomTopic(code), h);
    }
  } catch (e) {
    net.tr = null; net.status = 'idle';
    netNote('通信の準備に失敗しました（ネットにつながっているか確認してね）', 6);
  }
}
function netLeave(note) {
  if (net.tr) { try { net.tr.leave(); } catch (e) {} }
  net.tr = null; net.status = 'idle'; net.opp = null; net.members = []; net.ready = net.oppReady = false; net.oppSel = null;
  net.unstable = false;
  game.mode = 'net'; game.state = 'netRoom'; game.netMenu = false;
  if (note) netNote(note, 6);
}
function netStatus(st) {
  if (st === 'SUBSCRIBED') {
    net.unstable = false;
    if (net.status === 'connecting') { net.status = 'joined'; if (game.state === 'netRoom') game.state = 'netWait'; netRecalc(); }
  } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') {
    if (net.status === 'connecting') netLeave('部屋に入れませんでした（設定やネット接続を確認してね）');
    else if (net.status === 'joined') net.unstable = true;          // Supabase が自動でつなぎ直す。その間は「不安定」と表示
  }
}
function netPresence(list) { net.members = list || []; netRecalc(); }
function netRecalc() {                      // 部屋の顔ぶれから「あいて」と「ホスト」を決める（先に入った人がホスト）
  if (net.status !== 'joined') return;
  const list = net.members.filter(m => !net.timedOut[m.id]).sort((a, b) => a.t - b.t || (a.id < b.id ? -1 : 1));
  const idx = list.findIndex(m => m.id === net.id);
  if (idx < 0) return;                      // 自分の入室がまだ反映されていない
  if (idx >= 2) { netLeave('この部屋は満員です（2人まで）。ちがう部屋コードにしてね'); return; }
  net.host = idx === 0;
  const o = list[1 - idx] ? list[1 - idx].id : null;
  if (o !== net.opp) {
    const had = net.opp;
    net.opp = o;
    if (had) netOppLost('left');
    if (o) netOppJoined();
  }
}
function netOppJoined() {
  net.oppSel = null; net.oppReady = false; net.ready = false; net.wins = [0, 0]; net.lastRx = nowS(); net.again = [false, false];
  if (game.state === 'netWait' || game.state === 'netRoom') { game.state = 'netSelect'; game.t = 0; }
  Snd.se('decide');
  netNote('あいてが入ってきました！', 2.5);
  netSend({ k: 'sel', c: net.sel, r: 0, q: 1 });
  if (net.host) netSend({ k: 'rule', hp: game.hpRule, ab: game.abilities });
}
function netOppLost(reason) {
  net.oppReady = false; net.oppSel = null; net.again = [false, false];
  const s = game.state;
  if (game.mode === 'net' && (s === 'play' || s === 'ready')) { net.forfeit = true; boards[1].dead = true; netEnd('win'); }
  else if (s === 'intro' || s === 'netSelect' || s === 'netRule') { game.state = 'netWait'; net.ready = false; }
  netNote(reason === 'timeout' ? 'あいてとの通信が切れました' : 'あいてが部屋を出ました', 4);
}
setInterval(() => {                         // 生存確認：1秒ごとに合図を送り、あいてから届かなくなったら切断とみなす
  if (!net.tr || net.status !== 'joined') return;
  if (nowS() - net.lastTx > 0.9) netSend({ k: 'hb' });
  if (net.opp && !net.unstable && nowS() - net.lastRx > NET_TIMEOUT) {
    net.timedOut[net.opp] = 1; net.opp = null; netOppLost('timeout');
  }
}, 1000);

// ---- 受信 ----
function netRecv(d) {
  if (!d || typeof d !== 'object' || d.f === net.id) return;
  if (net.timedOut[d.f]) { delete net.timedOut[d.f]; netRecalc(); }
  if (d.f !== net.opp) return;
  net.lastRx = nowS();
  const s = game.state, live = s === 'ready' || s === 'play';
  const inMatch = game.mode === 'net' && (live || s === 'over') && d.m === net.match;
  switch (d.k) {
    case 'sel':
      net.oppSel = (d.c >= 0 && d.c < CHARS.length) ? d.c : null; net.oppReady = !!d.r && net.oppSel != null;
      if (d.q) { netSendSel(); if (net.host) netSend({ k: 'rule', hp: game.hpRule, ab: game.abilities }); }
      if (!net.oppReady && s === 'netRule') game.state = 'netSelect';
      break;
    case 'rule': if (!net.host) { game.hpRule = !!d.hp; game.abilities = !!d.ab; } break;
    case 'start': if (!net.host) netApplyStart(d); break;
    case 'again': net.again[1] = true; if (net.host && net.again[0] && s === 'over') netStartMatch(); break;
    case 'toSel': if (s === 'over' || s === 'netRule') { netToSelect(); netNote('あいてがキャラ選択にもどりました', 3); } break;
    case 'st': if (inMatch) netApplyState(d); break;
    case 'clr': if (inMatch && live) netOnClear(d); break;
    case 'garb': if (inMatch && live) netOnGarb(d); break;
    case 'dead': if (d.m === net.match) netOnDead(); break;
  }
}
const netSendSel = () => netSend({ k: 'sel', c: net.sel, r: net.ready ? 1 : 0 });

// ---- 試合の開始（ホストが乱数の種を決めて送る）----
function netStartMatch() {
  if (!net.host || !net.opp || net.oppSel == null) return;
  const seed = ((Math.random() * 4294967296) >>> 0) || 1;
  netSend({ k: 'start', seed, hp: game.hpRule, ab: game.abilities, a: net.sel, b: net.oppSel });   // a=ホストのキャラ b=ゲストのキャラ
  netBeginIntro(seed);
}
function netApplyStart(d) {
  if (game.mode !== 'net' || !net.opp) return;
  game.hpRule = !!d.hp; game.abilities = !!d.ab;
  if (d.a >= 0 && d.a < CHARS.length) net.oppSel = d.a;
  if (d.b >= 0 && d.b < CHARS.length) net.sel = d.b;
  netBeginIntro(d.seed >>> 0);
}
function netBeginIntro(seed) {
  net.seed = seed; net.match = seed; net.again = [false, false]; net.deadSent = false; net.forfeit = false; net.result = null;
  game.state = 'intro'; game.t = 0; game.netMenu = false; Snd.se('decide');
}
function netMatchBegin() {                  // startMatch() から呼ばれる。右の盤面は「あいての画面を映すだけ」にする
  game.netMenu = false; net.lastSt = ''; net.lastStT = 0; net.deadSent = false;
  const m = boards[1]; m.remote = true; m.isCpu = false; m.hpHold = 0;
}
function netToSelect() {
  net.ready = false; net.oppReady = false; net.again = [false, false];
  game.state = 'netSelect'; game.t = 0;
  netSendSel();
}

// ---- 盤面の状態を送る／映す ----
function netEncode(b) {
  let g = '';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const x = b.grid[r][c]; g += !x ? '.' : x.g ? 'x' : String(x.t); }
  const p = b.piece && b.phase === 'fall' ? [b.piece.a, b.piece.b, b.piece.x, b.piece.y, b.piece.rot] : 0;
  return { g, p, q: b.queue.slice(0, 2), hp: Math.round(b.hp * 10) / 10, pd: b.pending, ki: b.kiai || 0, kf: b.kiaiFull ? 1 : 0,
           mk: b.marked && b.markSet ? Array.from(b.markSet) : 0, dd: b.dead ? 1 : 0 };
}
function netTick(force) {
  const t = nowS();
  if (!force && t - net.lastStT < NET_ST_IV) return;
  const st = netEncode(boards[0]), js = JSON.stringify(st);
  if (!force && js === net.lastSt && t - net.lastStT < 1) return;   // 変わっていなければ1秒に1回だけ
  net.lastSt = js; net.lastStT = t;
  st.k = 'st'; netSend(st);
}
function netApplyState(d) {
  if (typeof d.g !== 'string' || d.g.length !== ROWS * COLS) return;
  const m = boards[1], old = m.grid || [];
  const g = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  const oldN = Array(COLS).fill(0), newN = Array(COLS).fill(0);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = d.g[r * COLS + c];
    if (old[r] && old[r][c] && old[r][c].g) oldN[c]++;
    if (ch === 'x') { const o = old[r] && old[r][c]; g[r][c] = (o && o.g) ? o : { g: true }; newN[c]++; }
    else if (ch >= '0' && ch <= '5') g[r][c] = { t: +ch };
  }
  // 列ごとにお邪魔が増えた分は、上から降ってくるように見せる
  let added = 0;
  for (let c = 0; c < COLS; c++) {
    let extra = newN[c] - oldN[c], k = 0;
    for (let r = 0; r < ROWS && extra > 0; r++) {
      if (g[r][c] && g[r][c].g) { g[r][c] = { g: true, fy: -(r + 1 + k++ * 0.9) * CS - Math.random() * 28 - 10, vy: 0 }; extra--; added++; }
    }
  }
  m.grid = g;
  if (added) { m.garbFalling = true; m.garbLanded = false; m.garbN = added; }
  const p = d.p;
  m.piece = Array.isArray(p) ? { a: p[0], b: p[1], x: p[2], y: p[3], rot: p[4] } : null;
  m.phase = m.piece ? 'fall' : 'wait';
  if (Array.isArray(d.q) && d.q.length) m.queue = d.q;
  const hp = +d.hp;
  if (isFinite(hp)) m.hp = performance.now() < (m.hpHold || 0) ? Math.min(m.hp, hp) : hp;   // 攻撃した直後は、こちらで先に減らした値を優先
  m.pending = d.pd | 0; m.kiai = +d.ki || 0; m.kiaiFull = !!d.kf; m.dead = !!d.dd;
  if (Array.isArray(d.mk) && d.mk.length) { m.marked = { cells: [] }; m.markSet = new Set(d.mk); } else { m.marked = null; m.markSet = null; }
}

// ---- あいての攻撃を受け取る（体力やお邪魔は、受け取った側の画面が正しい値を持つ）----
function netOnClear(d) {
  const me = boards[0], op = boards[1], ch = Math.max(1, d.ch | 0), dm = Math.max(0, +d.d || 0), add = Math.max(0, d.add | 0), mx = +d.mx || 1;
  op.bounce = 0.3; op.flashT = 0.6; op.flashChain = ch; me.hit = 0.4; if (ch >= 2) op.joyT = JOY_TIME;
  Snd.se('clear', ch, 0.55);
  if (ch >= 2) pop(op.centerX(), op.y0 + 120, ch + '連鎖!', '#fff3bf', 36);
  if (game.hpRule) {
    if (dm > 0) { me.hp = Math.max(0, me.hp - dm); pop(me.centerX(), 110, '-' + Math.round(dm), '#ff8787', 28); Snd.se('hit', dm, 1); }
  } else if (add > 0) {
    pop(me.centerX(), 110, 'お邪魔+' + add + (mx > 1.01 ? '（×' + mx.toFixed(1) + '）' : ''), mx > 1.01 ? '#ffa94d' : '#e9ecef', mx > 1.01 ? 26 : 22);
    Snd.se('hit', add * 1.6, 1);
  }
}
function netOnGarb(d) {
  const me = boards[0], op = boards[1];
  let s = Math.max(0, d.n | 0); if (!s) return;
  if (me.pw === 'longleg') s = Math.max(1, Math.round(s * 0.8));          // ロングレッグの軽減は受け取った側で
  me.pending += s;
  Snd.se('attack', s, 0.55); spawnShot(op, me, s);
}

// ---- 勝ち負け ----
function checkEndNet() {
  const me = boards[0];
  if (game.state !== 'play' || net.deadSent) return;
  if (me.hp <= 0 || me.dead) { net.deadSent = true; netTick(true); netSend({ k: 'dead' }); netEnd('lose'); }
}
function netOnDead() {
  const s = game.state;
  if (s === 'play' || s === 'ready') { boards[1].dead = true; netEnd('win'); }
  else if (s === 'over' && net.result === 'lose' && nowS() - net.endAt < 3) {     // ほぼ同時に負けた → 引き分け
    const R = game.rec; R.net.lose = Math.max(0, R.net.lose - 1); R.net.draw++; saveRec();
    net.wins[1] = Math.max(0, net.wins[1] - 1);
    game.result = net.result = 'draw';
  }
}
function netEnd(res) {
  game.state = 'over'; game.result = net.result = res; game.t = 0; game.cursor = 0; game.netMenu = false; resetHeld();
  net.endAt = nowS(); net.again = [false, false];
  const R = game.rec; R.matches++; R.net[res] = (R.net[res] || 0) + 1;
  if (res === 'win') net.wins[0]++; else if (res === 'lose') net.wins[1]++;
  saveRec(); Snd.se(res === 'win' ? 'win' : 'lose');
}

// ---- 入力 ----
const NET_MENU = ['ゲームにもどる', '降参する'];
function chooseNetMenu(i) {
  game.netMenu = false; Snd.se('select');
  if (i === 1) boards[0].dead = true;          // 降参＝自分の負け（相手に負けの通知が届く）
}
function netOverItems() { return net.opp ? ['もう一度（同じキャラで）', 'キャラクター選択へ', '部屋を出る'] : ['部屋で次のあいてを待つ', '部屋を出る']; }
function chooseNetOver(i) {
  if (!net.opp) {
    if (i === 0) { game.state = net.tr ? 'netWait' : 'netRoom'; Snd.se('select'); } else { netLeave(); Snd.se('select'); }
    return;
  }
  if (i === 0) {
    if (net.again[0]) return;
    net.again[0] = true; netSend({ k: 'again' }); Snd.se('decide');
    if (net.host && net.again[1]) netStartMatch();
  } else if (i === 1) { netSend({ k: 'toSel' }); netToSelect(); Snd.se('select'); }
  else { netLeave(); Snd.se('select'); }
}
function netOverPress(btn, ok) {
  const n = netOverItems().length;
  if (game.cursor >= n) game.cursor = 0;
  if (btn === 'U') { game.cursor = (game.cursor + n - 1) % n; Snd.se('select'); }
  else if (btn === 'D') { game.cursor = (game.cursor + 1) % n; Snd.se('select'); }
  else if (ok) chooseNetOver(game.cursor);
}
function netToggleRule(row) {
  if (!net.host) return;
  if (row === 0) game.hpRule = !game.hpRule; else game.abilities = !game.abilities;   // ネット対戦の設定は保存しない（ひとりで用の設定はそのまま）
  Snd.se('select');
  netSend({ k: 'rule', hp: game.hpRule, ab: game.abilities });
}
function netPress(btn, isRepeat) {
  const s = game.state, ok = btn === 'A' || btn === 'OK' || btn === 'PAUSE', back = btn === 'B' || btn === 'BACK';
  if (s === 'netRoom') {
    if (back && !isRepeat) { if (net.status === 'connecting') netLeave(); else exitNet(); Snd.se('select'); }
    else if (ok && !isRepeat) netUI.submit();
    return;
  }
  if (s === 'netWait') { if (back && !isRepeat) { netLeave(); Snd.se('select'); } return; }
  if (s === 'netSelect') {
    const n = CHARS.length;
    if (btn === 'L' && !net.ready) { net.sel = (net.sel + n - 1) % n; Snd.se('select'); netSendSel(); }
    else if (btn === 'R' && !net.ready) { net.sel = (net.sel + 1) % n; Snd.se('select'); netSendSel(); }
    else if ((btn === 'A' || btn === 'U' || btn === 'OK' || btn === 'PAUSE') && !isRepeat && !net.ready) { net.ready = true; Snd.se('decide'); netSendSel(); }
    else if (btn === 'B' && !isRepeat && net.ready) { net.ready = false; Snd.se('select'); netSendSel(); }
    else if (btn === 'BACK' && !isRepeat) { netLeave(); Snd.se('select'); }
    return;
  }
  if (s === 'netRule') {
    if (back && !isRepeat) { net.ready = false; netSendSel(); game.state = 'netSelect'; game.t = 0; Snd.se('select'); return; }
    if (!net.host) return;
    if (btn === 'U' || btn === 'D') { game.vrRow = 1 - game.vrRow; Snd.se('select'); }
    else if (btn === 'L' || btn === 'R') netToggleRule(game.vrRow);
    else if (ok && !isRepeat) netStartMatch();
  }
}
function netLobbyStep(dt) {
  const s = game.state;
  if (s === 'netRoom' && net.status === 'connecting' && nowS() - net.connT > 15) netLeave('つながりませんでした。設定やネット接続を確認してね');
  if (s === 'netSelect') {
    if (net.ready && net.oppReady && net.opp) { game.t += dt; if (game.t >= 0.6) { game.state = 'netRule'; game.vrRow = 0; Snd.se('decide'); } }
    else game.t = 0;
  }
  if (s === 'netRule' && !(net.ready && net.oppReady && net.opp)) { game.state = 'netSelect'; game.t = 0; }
}
function netClick(inR) {
  const s = game.state;
  if (inR(BACK_BTN)) { press('BACK'); return; }
  if (s === 'netSelect') {
    for (let i = 0; i < CHARS.length; i++) if (inR({ x: cardX(i), y: CARD_Y, w: CARD_W, h: CARD_H })) {
      if (net.ready) return;
      if (net.sel === i) press('OK'); else { net.sel = i; Snd.se('select'); netSendSel(); }
      return;
    }
    if (inR(vsPanel(0))) press(net.ready ? 'B' : 'OK');
    return;
  }
  if (s === 'netRule' && net.host) {
    for (let i = 0; i < 2; i++) if (inR(ruleCard(i))) { game.vrRow = 0; if (game.hpRule !== (i === 0)) netToggleRule(0); return; }
    for (let i = 0; i < 2; i++) if (inR(abBtnVs(i))) { game.vrRow = 1; if (game.abilities !== (i === 0)) netToggleRule(1); return; }
    if (inR(START_BTN)) press('OK');
  }
}
function netOverClick(inR) {
  const n = netOverItems().length;
  for (let i = 0; i < n; i++) if (inR(vsBtn(i))) { game.cursor = i; chooseNetOver(i); return; }
}

// ---- 部屋コードの入力欄（文字入力はキャンバスでは難しいので、HTML の入力欄をキャンバスの上に重ねる）----
const NET_FORM = { x: W / 2 - 300, y: 196, w: 600, h: 236 };
const netUI = (() => {
  let root = null, input = null, joinBtn = null, rndBtn = null, lastKey = '', focused = false;
  function build() {
    const st = document.createElement('style');
    st.textContent = `
      #netui { position: fixed; display: none; flex-direction: column; align-items: center; justify-content: center; gap: .55em;
        box-sizing: border-box; padding: .6em 1.2em; font-family: ${FONT}; color: #343a40; z-index: 5; }
      #netui label { font-weight: bold; font-size: .95em; color: #0b7285; }
      #netui .row { display: flex; gap: .5em; width: 100%; justify-content: center; }
      #netui input { font: bold 1.5em ${FONT}; width: 9.5em; min-width: 0; padding: .25em .55em; border: 3px solid #99e9f2; border-radius: .6em;
        color: #343a40; background: #fff; outline: none; text-align: center; letter-spacing: .06em; }
      #netui input:focus { border-color: #0c8599; }
      #netui button { font: bold 1.15em ${FONT}; border: 0; border-radius: 1.2em; padding: .35em 1.2em; cursor: pointer; color: #fff; background: #ff922b; }
      #netui button.rnd { font-size: .85em; font-weight: bold; background: #fff; color: #0b7285; border: 2px solid #99e9f2; padding: .45em 1.2em; }
      #netui button:disabled, #netui input:disabled { opacity: .5; cursor: default; }
      #netui .or { font-size: .75em; color: #6c747d; }`;
    document.head.appendChild(st);
    root = document.createElement('div'); root.id = 'netui';
    root.innerHTML = `<label for="net-code">部屋コード（合言葉）</label>
      <div class="row"><input id="net-code" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="例：1234"><button class="go" type="button">入る</button></div>
      <div class="or">または</div>
      <button class="rnd" type="button">ランダムな番号で部屋をつくる</button>`;
    document.body.appendChild(root);
    input = root.querySelector('input'); joinBtn = root.querySelector('.go'); rndBtn = root.querySelector('.rnd');
